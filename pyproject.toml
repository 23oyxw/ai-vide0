[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-p", "no:cacheprovider",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require running server)",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

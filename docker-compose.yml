# Optional infrastructure - local demo runs without Docker
# Enable: docker compose up -d

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_video
      MYSQL_USER: orchestrator
      MYSQL_PASSWORD: orchestrator
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    profiles:
      - rag
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - l8
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: ai_video
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/l8_schema.sql:/docker-entrypoint-initdb.d/01_l8_schema.sql:ro

volumes:
  mysql_data:
  qdrant_data:
  postgres_data:

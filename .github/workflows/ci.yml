name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system deps + Python deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/test_unit_*.py -q

  integration-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator
          POSTGRES_DB: ai_video
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d ai_video" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      POSTGRES_URL: postgres://orchestrator:orchestrator@localhost:5432/ai_video
      DATABASE_URL: postgres://orchestrator:orchestrator@localhost:5432/ai_video
      REDIS_URL: redis://localhost:6379/0
      ORCHESTRATOR_HOST: 127.0.0.1
      ORCHESTRATOR_PORT: 8765
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system deps + Python deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start orchestrator
        run: |
          nohup python -m uvicorn orchestrator.main:app --host 127.0.0.1 --port 8765 &
          echo "waiting for /health..."
          for i in {1..30}; do
            sleep 1
            curl -sS http://127.0.0.1:8765/health && break || true
          done
      - name: Run integration tests
        run: python -m pytest tests/test_integration_api.py -q -k "not slow"
